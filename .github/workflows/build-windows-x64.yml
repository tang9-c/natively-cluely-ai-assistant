# Build a 64-bit Windows distributable of CueUp on GitHub Actions.
#
# Trigger: manual (workflow_dispatch) only. Run from the Actions tab in
# the GitHub UI, or with `gh workflow run build-windows-x64`.
#
# This workflow mirrors the Intel Mac release path, but runs on a native
# Windows runner so napi-rs emits index.win32-x64-msvc.node and
# electron-builder packages the x64 Windows installers.

name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Read package version
        id: package-version
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\n')" >> "$GITHUB_OUTPUT"

      - name: Typecheck Electron main process
        shell: bash
        run: npm run typecheck:electron

      - name: Run Windows packaging smoke tests
        shell: bash
        run: ELECTRON_RUN_AS_NODE=1 npx electron --test electron/services/__tests__/WindowsPackagingSmoke.test.mjs

      - name: Build renderer, main, and native module
        shell: bash
        run: |
          npm run build
          npm run build:electron:package
          npm run build:native

      - name: Validate Windows RAG release assets
        shell: bash
        run: node scripts/verify-rag-release-assets.js --platform=win32 --arch=x64

      - name: Package x64 with electron-builder
        shell: bash
        run: |
          rm -rf release
          npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged Windows runtime and native architecture
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-packaged-release.mjs --path release/win-unpacked --platform win32 --arch x64 | tee release/native-architecture-report.json

      - name: Verify Windows updater metadata and installer integrity
        shell: bash
        run: node scripts/verify-packaged-release.mjs --windows-update-dir release --version ${{ steps.package-version.outputs.version }}

      - name: Smoke test final Windows packaged runtime
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sensevoice"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sensevoice/model.int8.onnx" https://feigenbaum.cdn.bcebos.com/onnx/model.int8.onnx
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sensevoice/tokens.txt" https://feigenbaum.cdn.bcebos.com/onnx/tokens.txt
          node scripts/smoke-packaged-runtime.mjs --app release/win-unpacked --sensevoice-model-dir "$RUNNER_TEMP/sensevoice" --audio tests/fixtures/dynamic-actions/replay/audio/sales-pricing-objection-zh-001.wav | tee release/runtime-smoke-report.json

      - name: Validate Windows x64 artifact set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! compgen -G "release/*.exe" > /dev/null; then
            echo "Expected at least one Windows .exe artifact" >&2
            exit 1
          fi
          artifacts=(release/*.exe release/*.blockmap)
          printf '%s\n' "${artifacts[@]}"
          if compgen -G "release/*.dmg" > /dev/null || compgen -G "release/*.zip" > /dev/null; then
            echo "Unexpected macOS artifact in Windows workflow" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            if [[ "$name" == *arm64* || "$name" == *ia32* ]]; then
              echo "Unexpected non-x64 Windows artifact: $artifact" >&2
              exit 1
            fi
          done

      - name: Audit release size
        shell: bash
        run: node scripts/audit-release-size.js --path release/win-unpacked --json --min-bytes 734003200 --max-bytes 891289600 > release/size-report.json

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cueup-windows-x64-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/size-report.json
            release/native-architecture-report.json
            release/runtime-smoke-report.json
          if-no-files-found: error
          retention-days: 14
