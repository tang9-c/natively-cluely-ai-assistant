# Build an arm64 (Apple Silicon) macOS distributable of Natively on GitHub Actions.
#
# Trigger: manual (workflow_dispatch) only. Run from the Actions tab in
# the GitHub UI, or with `gh workflow run build-arm64-mac`.

name: Build ARM64 Mac

on:
  workflow_dispatch:

jobs:
  build-arm64-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build renderer, main, and native module
        env:
          NATIVELY_NATIVE_TARGETS: "aarch64-apple-darwin"
        run: |
          npm run build
          npm run build:electron
          npm run build:native
          rm -f native-module/index.darwin-x64.node

      - name: Install sharp macOS dependencies
        run: node scripts/ensure-sharp-mac-deps.js

      - name: Package arm64 with electron-builder
        run: |
          rm -rf release
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Prepare unsigned macOS helper files
        run: node scripts/prepare-unsigned-macos-release.js

      - name: Validate ARM64 artifact set
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release/*.dmg release/*.zip release/*.blockmap)
          printf '%s\n' "${artifacts[@]}"
          for artifact in "${artifacts[@]}"; do
            if [[ "$(basename "$artifact")" != *arm64* ]]; then
              echo "Unexpected non-arm64 artifact in ARM64 workflow: $artifact" >&2
              exit 1
            fi
          done
          test -e release/*arm64*.dmg
          test -e release/*arm64*.zip

      - name: Audit release size
        run: node scripts/audit-release-size.js > release/size-report.txt

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v5
        with:
          name: natively-arm64-mac-${{ github.run_id }}
          path: |
            release/*arm64*.zip
            release/*arm64*.dmg
            release/*arm64*.blockmap
            release/latest-mac.yml
            release/OPEN-UNSIGNED-NATIVELY-MAC.sh
            release/INSTALL-UNSIGNED-MACOS.txt
            release/size-report.txt
          if-no-files-found: error
          retention-days: 14
