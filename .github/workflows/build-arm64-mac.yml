# Build an arm64 (Apple Silicon) macOS distributable of CueUp on GitHub Actions.
#
# Trigger: manual (workflow_dispatch) only. Run from the Actions tab in
# the GitHub UI, or with `gh workflow run build-arm64-mac`.

name: Build ARM64 Mac

on:
  workflow_dispatch:

jobs:
  build-arm64-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Read package version
        id: package-version
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\n')" >> "$GITHUB_OUTPUT"

      - name: Build renderer, main, and native module
        env:
          NATIVELY_NATIVE_TARGETS: "aarch64-apple-darwin"
        run: |
          npm run build
          npm run build:electron:package
          npm run build:native
          rm -f native-module/index.darwin-x64.node

      - name: Install sharp macOS dependencies
        run: node scripts/ensure-sharp-mac-deps.js

      - name: Validate ARM64 RAG release assets
        run: node scripts/verify-rag-release-assets.js --platform=darwin --arch=arm64

      - name: Package arm64 with electron-builder
        run: |
          rm -rf release
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Prepare unsigned macOS helper files
        run: node scripts/prepare-unsigned-macos-release.js

      - name: Verify packaged ARM64 runtime and native architecture
        run: |
          set -o pipefail
          node scripts/verify-packaged-release.mjs --path release/mac-arm64/CueUp.app --platform darwin --arch arm64 | tee release/native-architecture-report.json

      - name: Smoke test final ARM64 packaged runtime
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sensevoice"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sensevoice/model.int8.onnx" https://feigenbaum.cdn.bcebos.com/onnx/model.int8.onnx
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sensevoice/tokens.txt" https://feigenbaum.cdn.bcebos.com/onnx/tokens.txt
          node scripts/smoke-packaged-runtime.mjs --app release/mac-arm64/CueUp.app --sensevoice-model-dir "$RUNNER_TEMP/sensevoice" --audio tests/fixtures/dynamic-actions/replay/audio/sales-pricing-objection-zh-001.wav | tee release/runtime-smoke-report.json

      - name: Validate ARM64 artifact set
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release/*.dmg release/*.zip release/*.blockmap)
          printf '%s\n' "${artifacts[@]}"
          for artifact in "${artifacts[@]}"; do
            if [[ "$(basename "$artifact")" != *arm64* ]]; then
              echo "Unexpected non-arm64 artifact in ARM64 workflow: $artifact" >&2
              exit 1
            fi
          done
          test -e release/*arm64*.dmg
          test -e release/*arm64*.zip

      - name: Validate ARM64 manual update assets
        run: node scripts/verify-packaged-release.mjs --mac-update-dir release --version ${{ steps.package-version.outputs.version }} --arch arm64

      - name: Audit release size
        run: node scripts/audit-release-size.js --path release/mac-arm64/CueUp.app --json --min-bytes 734003200 --max-bytes 891289600 > release/size-report.json

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cueup-arm64-mac-${{ github.run_id }}
          path: |
            release/*arm64*.zip
            release/*arm64*.dmg
            release/*arm64*.blockmap
            release/latest-mac.yml
            release/OPEN-UNSIGNED-CUEUP-MAC.sh
            release/INSTALL-UNSIGNED-MACOS.txt
            release/size-report.json
            release/native-architecture-report.json
            release/runtime-smoke-report.json
          if-no-files-found: error
          retention-days: 14
