# Aggregate distributable artifacts from the manual build-* workflows into a
# single draft GitHub Release.
#
# Trigger: workflow_run on completion of any of the three build workflows.
# Concurrency is keyed on the commit SHA so all three architectures settle
# into the same release.
#
# Tag format: v<package.json#version>-sha-<short-sha>, e.g. v2.7.0-sha-12c69499.
# Maintainers review and publish the draft from https://github.com/<owner>/<repo>/releases.

name: Release Publish

on:
  workflow_run:
    workflows:
      - Build Intel Mac
      - Build ARM64 Mac
      - Build Windows x64
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: release-publish-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false

    steps:
      - name: Skip when triggering build did not succeed
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Triggering workflow '${{ github.event.workflow_run.name }}' finished with '${{ github.event.workflow_run.conclusion }}' — skipping release publish."
          exit 0

      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute release tag from package.json + commit SHA
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA_SHORT="${HEAD_SHA::7}"
          TAG="v${VERSION}-sha-${SHA_SHORT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: ${TAG}"

      - name: Wait for all expected builds to settle at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Resolve the three build workflow IDs once and cache them on disk so
          # subsequent steps can iterate without re-querying or relying on
          # ${{ steps.*.outputs.* }} (which is fragile in subshells).
          gh api "repos/${REPO}/actions/workflows?per_page=100" --jq '
            [.workflows[]
              | select(.name == "Build Intel Mac"
                     or .name == "Build ARM64 Mac"
                     or .name == "Build Windows x64")
              | {id: .id, name: .name}]
          ' > /tmp/wf_ids.json

          count=$(jq 'length' /tmp/wf_ids.json)
          if [ "${count}" -eq 0 ]; then
            echo "::error::Could not find any of the three expected build workflows in ${REPO}."
            exit 1
          fi
          echo "Resolved ${count} build workflows:"
          jq -r '.[] | "  \(.name) -> id=\(.id)"' /tmp/wf_ids.json

          # Poll up to 50 × 30s = 25 minutes for sibling builds that are still running.
          # A workflow that has NO runs at this SHA (status=null) is treated as
          # "not part of this release" and skipped — release-publish should
          # happily aggregate whichever architectures were actually built, rather
          # than block forever waiting for builds that were never triggered.
          for attempt in $(seq 1 50); do
            all_done=true
            any_failed=false
            any_in_flight=false
            status_lines=()

            while IFS= read -r row; do
              wf_id=$(echo "${row}" | jq -r '.id')
              wf_name=$(echo "${row}" | jq -r '.name')
              result=$(gh api "repos/${REPO}/actions/workflows/${wf_id}/runs?head_sha=${HEAD_SHA}&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status)|\(.conclusion)"' 2>/dev/null || echo "|")
              status="${result%%|*}"
              conclusion="${result##*|}"
              status_lines+=("  ${wf_name}: status=${status} conclusion=${conclusion}")

              if [ "${status}" = "null" ] || [ -z "${status}" ]; then
                # No runs at this SHA — this workflow simply isn't part of
                # this release. Do not block waiting for it.
                :
              elif [ "${status}" = "completed" ]; then
                if [ "${conclusion}" != "success" ]; then
                  any_failed=true
                fi
              else
                # in_progress / queued / requested / waiting / pending
                all_done=false
                any_in_flight=true
              fi
            done < <(jq -c '.[]' /tmp/wf_ids.json)

            echo "[poll ${attempt}]"
            printf '%s\n' "${status_lines[@]}"

            if [ "${all_done}" = "true" ]; then
              if [ "${any_failed}" = "true" ]; then
                echo "At least one in-flight build did not succeed; will still attempt to publish whatever artifacts succeeded."
              fi
              if [ "${any_in_flight}" = "false" ]; then
                echo "No runs exist for some architectures at this SHA; publishing whatever is available."
              fi
              break
            fi

            if [ "${attempt}" -eq 50 ]; then
              echo "Timed out waiting for in-flight builds; aborting."
              exit 0
            fi
            sleep 30
          done

      - name: Discover successful build runs and their artifact names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Map of workflow display name → artifact name prefix.
          # Keep in sync with .github/workflows/build-*.yml upload-artifact names.
          declare -A ARTIFACT_PREFIX=(
            ["Build Intel Mac"]="cueup-intel-mac-"
            ["Build ARM64 Mac"]="cueup-arm64-mac-"
            ["Build Windows x64"]="cueup-windows-x64-"
          )

          # Build /tmp/builds.json by iterating /tmp/wf_ids.json (built in the
          # previous step) and looking up each workflow's most recent successful
          # run at this SHA. Writes go to a file, not to $GITHUB_OUTPUT, to
          # avoid the subshell-pipeline output-loss bug.
          jq -n '{builds: []}' > /tmp/builds.json
          while IFS= read -r row; do
            wf_id=$(echo "${row}" | jq -r '.id')
            wf_name=$(echo "${row}" | jq -r '.name')
            prefix="${ARTIFACT_PREFIX[${wf_name}]:-}"
            if [ -z "${prefix}" ]; then
              echo "${wf_name}: no artifact prefix registered, skipping"
              continue
            fi
            run_id=$(gh api "repos/${REPO}/actions/workflows/${wf_id}/runs?head_sha=${HEAD_SHA}&status=completed&conclusion=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "${run_id}" ]; then
              echo "${wf_name}: no successful run at this SHA, skipping"
              continue
            fi
            echo "${wf_name}: run_id=${run_id} prefix=${prefix}"
            jq --arg name "${wf_name}" \
               --argjson run_id "${run_id}" \
               --arg prefix "${prefix}" \
               '.builds += [{name: $name, run_id: $run_id, artifact_prefix: $prefix}]' \
               /tmp/builds.json > /tmp/builds.json.new
            mv /tmp/builds.json.new /tmp/builds.json
          done < <(jq -c '.[]' /tmp/wf_ids.json)

          count=$(jq '.builds | length' /tmp/builds.json)
          echo "Total successful build runs: ${count}"
          jq -r '.builds[] | "  \(.name) -> run=\(.run_id) prefix=\(.artifact_prefix)"' /tmp/builds.json
          if [ "${count}" -eq 0 ]; then
            echo "::error::No successful build runs found at SHA ${HEAD_SHA}; nothing to publish."
            exit 1
          fi

      - name: Download distributable artifacts from each successful run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          # /tmp/builds.json shape is {"builds":[{name,run_id,artifact_prefix},...]} —
          # iterate the inner array, not the top-level object keys.
          jq -c '.builds[]' /tmp/builds.json | while read -r row; do
            wf_name=$(echo "${row}" | jq -r '.name')
            run_id=$(echo "${row}" | jq -r '.run_id')
            prefix=$(echo "${row}" | jq -r '.artifact_prefix')
            safe_dir=$(echo "${wf_name}" | tr ' ' '-')
            target="artifacts/${safe_dir}"
            mkdir -p "${target}"
            echo "::group::Downloading artifacts for ${wf_name} (run ${run_id})"
            gh run download "${run_id}" --dir "${target}" --pattern "${prefix}*" || {
              echo "::warning::gh run download failed for ${wf_name}; will retry with broader pattern"
              gh run download "${run_id}" --dir "${target}"
            }
            echo "::endgroup::"
          done

          echo "Downloaded artifact tree:"
          find artifacts -type f -printf '  %p (%s bytes)\n' | sort

      - name: Compose release body from RELEASE_TEMPLATE + commit info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          template=".github/RELEASE_TEMPLATE.md"
          if [ -f "${template}" ]; then
            {
              cat "${template}"
              echo ""
              echo "## Architectures in this release"
              jq -r '.builds[].name' /tmp/builds.json | sed 's/^/- /'
              echo ""
              echo "## Source"
              echo "Commit: \`${HEAD_SHA}\` — https://github.com/${REPO}/commit/${HEAD_SHA}"
            } > /tmp/release-body.md
          else
            {
              echo "## Source"
              echo "Commit: \`${HEAD_SHA}\` — https://github.com/${REPO}/commit/${HEAD_SHA}"
              echo ""
              echo "## Architectures"
              jq -r '.builds[].name' /tmp/builds.json | sed 's/^/- /'
            } > /tmp/release-body.md
          fi
          echo "Release body preview:"
          head -40 /tmp/release-body.md

      - name: Skip upload if release already has the expected artifacts
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if ! gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} does not exist yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release exists — but is it populated? A previously-published empty
          # draft must be re-uploaded so this workflow is self-healing for the
          # case where a prior run lost assets (subshell bug, GH outage, etc.).
          existing_assets=$(gh release view "${tag}" --json assets --jq '.assets | length')
          echo "Release ${tag} exists with ${existing_assets} asset(s)."
          if [ "${existing_assets}" -gt 0 ]; then
            echo "Release already populated; skipping upload to avoid duplicating assets."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release exists but has no assets; will upload."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts to a new (or empty) draft release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: false
          body_path: /tmp/release-body.md
          fail_on_unmatched_files: false
          files: |
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/*.zip
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/*.dmg
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/*.blockmap
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/latest-mac.yml
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/OPEN-UNSIGNED-CUEUP-MAC.sh
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/INSTALL-UNSIGNED-MACOS.txt
            artifacts/Build-Intel-Mac/cueup-intel-mac-*/size-report.txt
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/*arm64*.zip
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/*arm64*.dmg
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/*arm64*.blockmap
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/latest-mac.yml
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/OPEN-UNSIGNED-CUEUP-MAC.sh
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/INSTALL-UNSIGNED-MACOS.txt
            artifacts/Build-ARM64-Mac/cueup-arm64-mac-*/size-report.txt
            artifacts/Build-Windows-x64/cueup-windows-x64-*/*.exe
            artifacts/Build-Windows-x64/cueup-windows-x64-*/*.blockmap
            artifacts/Build-Windows-x64/cueup-windows-x64-*/latest.yml
            artifacts/Build-Windows-x64/cueup-windows-x64-*/size-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
