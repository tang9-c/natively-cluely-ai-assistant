name: System Audio Permissions

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  system-audio-permissions:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: System audio permission contracts and lifecycle
        run: npm run test:system-audio-permissions
      - name: Production permissions UI and meeting flows
        run: npm run test:system-audio-permissions:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: system-audio-permissions-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
