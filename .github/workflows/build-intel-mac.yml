# Build an x86_64 (Intel) macOS distributable of CueUp on GitHub Actions.
#
# Trigger: manual (workflow_dispatch) only. Run from the Actions tab in
# the GitHub UI, or with `gh workflow run build-intel-mac`.
#
# Why macos-latest + cross-compile: as of 2026, GitHub's macos-13
# (Intel x86_64) hosted runner is severely under-provisioned and can sit
# queued for 30+ minutes. macos-latest (arm64) runners allocate much
# faster; we use them and cross-compile the Rust native module +
# better-sqlite3 + keytar + sherpa-onnx-node + sharp to
# x86_64-apple-darwin via NATIVELY_NATIVE_TARGETS.
# Because Rust/napi build scripts may execute x86_64 helper binaries during
# cross-compilation, the arm64 runner must have Rosetta installed.
# electron-builder then packages the x64-only artifact (--mac --x64).
#
# Tuning notes:
#   - To switch to native x86_64 (when macos-13 is reliable again),
#     change runs-on to macos-13 and drop the
#     NATIVELY_NATIVE_TARGETS env var from the build step.
#   - CSC_IDENTITY_AUTO_DISCOVERY=false prevents electron-builder from
#     looking for an Apple cert in the CI keychain (we use ad-hoc signing).
#   - Bump timeout-minutes to 60-90 if the cold first run exceeds 45.

name: Build Intel Mac

on:
  workflow_dispatch:

jobs:
  build-intel-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rosetta for x64 native build scripts
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install dependencies
        run: npm install

      - name: Read package version
        id: package-version
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\n')" >> "$GITHUB_OUTPUT"

      # The fixture validator runs as a PR gate in sales-transcript-fixture.yml:
      # node tests/utils/sales-transcript-fixture-validator.mjs tests/fixtures/demo/03_master_transcript/sales/sales_full_lifecycle_meeting.json

      - name: Build renderer, main, and native module
        env:
          NATIVELY_NATIVE_TARGETS: "x86_64-apple-darwin"
        run: |
          npm run build
          npm run build:electron:package
          npm run build:native
          rm -f native-module/index.darwin-arm64.node

      - name: Install sharp macOS dependencies
        run: node scripts/ensure-sharp-mac-deps.js

      - name: Install PDF canvas macOS dependencies
        run: node scripts/ensure-canvas-mac-deps.js

      - name: Validate Intel RAG release assets
        run: node scripts/verify-rag-release-assets.js --platform=darwin --arch=x64

      - name: Package x64 with electron-builder
        run: |
          rm -rf release
          npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Prepare unsigned macOS helper files
        run: node scripts/prepare-unsigned-macos-release.js

      - name: Verify packaged Intel runtime and native architecture
        run: |
          set -o pipefail
          node scripts/verify-packaged-release.mjs --path release/mac/CueUp.app --platform darwin --arch x64 | tee release/native-architecture-report.json

      - name: Smoke test final Intel packaged runtime
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sensevoice"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sensevoice/model.int8.onnx" https://feigenbaum.cdn.bcebos.com/onnx/model.int8.onnx
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sensevoice/tokens.txt" https://feigenbaum.cdn.bcebos.com/onnx/tokens.txt
          node scripts/smoke-packaged-runtime.mjs --app release/mac/CueUp.app --sensevoice-model-dir "$RUNNER_TEMP/sensevoice" --audio tests/fixtures/dynamic-actions/replay/audio/sales-pricing-objection-zh-001.wav | tee release/runtime-smoke-report.json

      - name: Validate Intel artifact set
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release/*.dmg release/*.zip release/*.blockmap)
          printf '%s\n' "${artifacts[@]}"
          for artifact in "${artifacts[@]}"; do
            if [[ "$(basename "$artifact")" == *arm64* ]]; then
              echo "Unexpected arm64 artifact in Intel workflow: $artifact" >&2
              exit 1
            fi
          done
          test -e release/*.dmg
          test -e release/*.zip

      - name: Validate Intel manual update assets
        run: node scripts/verify-packaged-release.mjs --mac-update-dir release --version ${{ steps.package-version.outputs.version }} --arch x64

      - name: Audit release size
        run: node scripts/audit-release-size.js --path release/mac/CueUp.app --json --min-bytes 734003200 --max-bytes 891289600 > release/size-report.json

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cueup-intel-mac-${{ github.run_id }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml
            release/OPEN-UNSIGNED-CUEUP-MAC.sh
            release/INSTALL-UNSIGNED-MACOS.txt
            release/size-report.json
            release/native-architecture-report.json
            release/runtime-smoke-report.json
          if-no-files-found: error
          retention-days: 14
