# Build an x86_64 (Intel) macOS distributable of Natively on GitHub Actions.
#
# Trigger: manual (workflow_dispatch) only. Run from the Actions tab in
# the GitHub UI, or with `gh workflow run build-intel-mac`.
#
# Why macos-latest + cross-compile: as of 2026, GitHub's macos-13
# (Intel x86_64) hosted runner is severely under-provisioned and can sit
# queued for 30+ minutes. macos-latest (arm64) runners allocate much
# faster; we use them and cross-compile the Rust native module +
# better-sqlite3 + keytar + sharp to x86_64-apple-darwin via
# NATIVELY_BUILD_ALL_MAC_ARCHES=1. electron-builder then packages the
# x64-only artifact (--mac --x64).
#
# Tuning notes:
#   - To switch to native x86_64 (when macos-13 is reliable again),
#     change runs-on to macos-13 and drop the
#     NATIVELY_BUILD_ALL_MAC_ARCHES env var from the build step.
#   - CSC_IDENTITY_AUTO_DISCOVERY=false prevents electron-builder from
#     looking for an Apple cert in the CI keychain (we use ad-hoc signing).
#   - Bump timeout-minutes to 60-90 if the cold first run exceeds 45.

name: Build Intel Mac

on:
  workflow_dispatch:

jobs:
  build-intel-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer, main, and native module
        env:
          NATIVELY_BUILD_ALL_MAC_ARCHES: "1"
        run: |
          npm run build
          npm run build:electron
          npm run build:native

      - name: Install sharp macOS dependencies
        run: node scripts/ensure-sharp-mac-deps.js

      - name: Package x64 with electron-builder
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natively-intel-mac-${{ github.run_id }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
